name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build
    # Default Xcode on macos-26 is 26.6; switch to Xcode 27 once it leaves preview on hosted runners.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        run: brew install just

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint
        run: just lint

      - name: Test with coverage
        run: just coverage

      - name: Build app
        run: just app
