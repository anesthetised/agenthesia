name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build
    # Default Xcode on macos-26 is 26.6; switch to Xcode 27 once it leaves preview on hosted runners.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        run: brew install just

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint
        run: just lint

      # TEMPORARY: diagnose the test-process stall in #100; revert before merge.
      - name: Diagnose stall
        continue-on-error: true
        working-directory: Packages/AgenthesiaKit
        run: |
          sysctl hw.ncpu
          swift build --build-tests 2>&1 | tail -1
          xcrun --kill-cache
          time /usr/bin/git --version
          time /usr/bin/git --version
          xcrun --kill-cache
          swift test --skip-build --skip SessionWorkspaceTests --skip missingExecutableFailsBeforeCreatingAWorktree 2>&1 \
            | grep -E "✘|moduleLoads\(\) passed|Test run with" || true
          xcrun --kill-cache

      - name: Test with coverage
        run: just coverage --badge .build/badges/coverage.svg

      - name: Test benchmark and coverage tooling
        run: just test-scripts

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin badges:badges; then
            git worktree add /tmp/badges badges
          else
            git worktree add --orphan -b badges /tmp/badges
          fi
          cp .build/badges/coverage.svg /tmp/badges/coverage.svg
          cd /tmp/badges
          git add coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge"
          git push origin badges

      - name: Build app
        run: just app
