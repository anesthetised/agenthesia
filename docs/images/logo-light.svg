<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Agenthesia">
  <!-- Static copy of AppIcon (AgenthesiaUI/AppIcon.swift) with three stars lit; change them together.
       No filter or mask touches the art itself: WebKit rasterizes those at display size, so they pixelate when zoomed. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CC9FF"/><stop offset="1" stop-color="#3563D8"/></linearGradient>
    <linearGradient id="moon" x1="0" y1="24" x2="0" y2="84" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFF7DA"/><stop offset="1" stop-color="#FFD161"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="2"/></filter>
    <clipPath id="tile"><rect width="100" height="100" rx="22.5"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="url(#sky)"/>
    <use href="#art" filter="url(#lift)" opacity=".2"/>
    <g id="art">
      <path d="M48.193 24.08A30 30 0 1 0 75.882 56.656A22 22 0 0 1 48.193 24.08Z" fill="url(#moon)"/>
      <circle cx="29" cy="65" r="3.3" fill="#FB923C" opacity=".5"/>
      <g fill="none" stroke="#7A4B00" stroke-linecap="round">
        <path d="M27 54q5.5 5 11 0" stroke-width="3.4"/>
        <path d="M28.6 57.6L27 60.2M32.5 59.2v3M36.4 57.6L38 60.2" stroke-width="2"/>
        <path d="M38 66.5q3 2.8 6 0" stroke-width="2.6"/>
      </g>
      <g fill="#FFFFFF">
        <path d="M68 23Q68 30 75 30Q68 30 68 37Q68 30 61 30Q68 30 68 23Z"/>
        <path d="M81 44.4Q81 49 85.6 49Q81 49 81 53.6Q81 49 76.4 49Q81 49 81 44.4Z"/>
        <path d="M54 15Q54 19 58 19Q54 19 54 23Q54 19 50 19Q54 19 54 15Z"/>
        <path d="M83 18.6Q83 22 86.4 22Q83 22 83 25.4Q83 22 79.6 22Q83 22 83 18.6Z" opacity=".13"/>
        <path d="M64 47Q64 50 67 50Q64 50 64 53Q64 50 61 50Q64 50 64 47Z" opacity=".13"/>
      </g>
    </g>
    <rect width="100" height="100" fill="url(#shine)"/>
  </g>
  <rect x=".7" y=".7" width="98.6" height="98.6" rx="21.8" fill="none" stroke="#000" stroke-opacity=".07" stroke-width="1.4"/>
</svg>
